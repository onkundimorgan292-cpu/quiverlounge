<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiver Lounge | December 25th Mega Show</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07070a;
      --surface: #111118;
      --surface-light: #191924;
      --gold: #f5b942;
      --gold-glow: rgba(245, 185, 66, 0.35);
      --gold-grad: linear-gradient(135deg, #fce09b 0%, #f5b942 50%, #c68412 100%);
      --text: #f8f8fb;
      --muted: #9b9bb0;
      --whatsapp: #25d366;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow-x: hidden;
      line-height: 1.6;
    }

    .ambient-bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(circle at 15% 15%, rgba(245, 185, 66, 0.08), transparent 40%),
        radial-gradient(circle at 85% 75%, rgba(168, 85, 247, 0.06), transparent 45%);
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(7, 7, 10, 0.85);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-family: 'Cinzel', serif;
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: 2px;
      background: var(--gold-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-btn {
      background: var(--gold-grad);
      color: #000;
      padding: 9px 18px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 800;
      font-size: 0.85rem;
      box-shadow: 0 4px 18px var(--gold-glow);
    }

    .hero {
      text-align: center;
      padding: 56px 20px 40px;
      max-width: 900px;
      margin: 0 auto;
    }

    .event-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(245, 185, 66, 0.1);
      border: 1px solid rgba(245, 185, 66, 0.4);
      color: var(--gold);
      padding: 6px 16px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 18px;
    }

    .dot {
      width: 8px;
      height: 8px;
      background: var(--gold);
      border-radius: 50%;
      animation: blink 1.4s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.8); }
    }

    h1 {
      font-family: 'Cinzel', serif;
      font-size: clamp(2.1rem, 5vw, 3.4rem);
      line-height: 1.15;
      margin-bottom: 14px;
    }

    .hero p {
      color: var(--muted);
      font-size: 1.05rem;
      max-width: 580px;
      margin: 0 auto 28px;
    }

    .countdown {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 34px;
    }

    .time-box {
      background: var(--surface);
      border: 1px solid rgba(245, 185, 66, 0.25);
      border-radius: 14px;
      padding: 12px 16px;
      min-width: 72px;
    }

    .time-box span {
      display: block;
      font-size: 1.45rem;
      font-weight: 800;
      color: var(--gold);
      line-height: 1.1;
    }

    .time-box small {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
    }

    .hero-frame {
      max-width: 460px;
      margin: 0 auto;
      border-radius: 20px;
      padding: 4px;
      background: var(--gold-grad);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.75), 0 0 35px rgba(245, 185, 66, 0.2);
    }

    .hero-frame img {
      width: 100%;
      max-height: 460px;
      object-fit: cover;
      border-radius: 16px;
      display: block;
      background: var(--surface);
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 48px 20px;
    }

    .section-head {
      text-align: center;
      margin-bottom: 32px;
    }

    .section-head h2 {
      font-family: 'Cinzel', serif;
      font-size: 1.9rem;
      color: var(--gold);
      margin-bottom: 6px;
    }

    .section-head p {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 22px;
    }

    .tier-card {
      background: var(--surface);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    .tier-card.vvip {
      background: linear-gradient(180deg, #1b1710 0%, var(--surface) 100%);
      border: 2px solid var(--gold);
      box-shadow: 0 12px 35px rgba(245, 185, 66, 0.14);
    }

    .popular-tag {
      position: absolute;
      top: 16px;
      right: 16px;
      background: var(--gold-grad);
      color: #000;
      font-size: 0.7rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 999px;
      text-transform: uppercase;
    }

    .tier-name { font-size: 1.3rem; font-weight: 800; margin-bottom: 6px; }
    .tier-price { font-size: 2rem; font-weight: 800; color: var(--gold); margin-bottom: 16px; }

    .tier-list { list-style: none; margin-bottom: 24px; color: var(--muted); font-size: 0.94rem; }
    .tier-list li { margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
    .tier-list li::before { content: "✦"; color: var(--gold); font-size: 0.85rem; }

    .btn-tier {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 12px;
      background: var(--surface-light);
      color: #fff;
      font-weight: 700;
      cursor
